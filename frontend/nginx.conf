server {
  listen 80;

  # Inherited by the proxy_pass locations below. Without these the backend sees
  # every request as coming from this container, so per-client rate limiting
  # collapses into one shared bucket.
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/ {
    proxy_pass http://backend:8080/api/;
  }
  location /v3/ {
    proxy_pass http://backend:8080/v3/;
  }
  location /actuator/ {
    proxy_pass http://backend:8080/actuator/;
  }
  location /swagger-ui {
    proxy_pass http://backend:8080/swagger-ui;
  }
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
