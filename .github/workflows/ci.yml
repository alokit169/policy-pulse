name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Testcontainers starts a real PostgreSQL, so the suite exercises the
      # Flyway migrations and ddl-auto=validate exactly as production does.
      # Docker is preinstalled on GitHub-hosted runners.
      - name: Test
        working-directory: backend
        run: mvn -B test

      - name: Package
        working-directory: backend
        run: mvn -B -DskipTests package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # Runs tsc --noEmit and then the production build.
      - name: Build
        working-directory: frontend
        run: npm run build

  compose:
    name: Docker stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guards the class of bug that only appears in the container topology,
      # such as an nginx location missing for a route the SPA calls.
      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then
              echo "backend healthy"; exit 0
            fi
            sleep 5
          done
          echo "backend did not become healthy"; docker compose logs --tail=100; exit 1

      # Every check reports expected against actual, so a failure here names the
      # broken route instead of only failing the step.
      - name: Smoke test through the UI origin
        run: |
          set -uo pipefail
          failed=0
          check() {
            desc=$1; expected=$2; shift 2
            actual=$(curl -s -o /dev/null -w '%{http_code}' "$@")
            if [ "$actual" = "$expected" ]; then
              echo "ok    $desc ($actual)"
            else
              echo "FAIL  $desc: expected $expected, got $actual"
              failed=1
            fi
          }

          JSON='Content-Type: application/json'
          check "SPA root"          200 http://localhost:5173/
          check "SPA deep link"     200 http://localhost:5173/some/client/route
          check "health"            200 http://localhost:5173/actuator/health
          check "api docs"          200 http://localhost:5173/v3/api-docs
          check "protected api"     401 http://localhost:5173/api/customers
          check "bad credentials"   401 -X POST http://localhost:5173/api/auth/login \
                                        -H "$JSON" \
                                        -d '{"email":"nobody@test.local","password":"wrong"}'
          check "seeded demo login" 200 -X POST http://localhost:5173/api/auth/login \
                                        -H "$JSON" \
                                        -d '{"email":"agent@demo.local","password":"Password123!"}'

          # Authenticated routes, exercised with a real token.
          TOKEN=$(curl -s -X POST http://localhost:5173/api/auth/login \
                    -H "$JSON" \
                    -d '{"email":"agent@demo.local","password":"Password123!"}' \
                  | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          if [ -z "$TOKEN" ]; then
            echo "FAIL  could not obtain a token"; exit 1
          fi
          AUTH="Authorization: Bearer $TOKEN"

          # Phone is unique per tenant, so a fixed number would make this script
          # pass only against an empty database.
          PHONE="+91$(date +%s | tail -c 10)"

          check "customer list"     200 -H "$AUTH" http://localhost:5173/api/customers
          check "customer create"   201 -X POST http://localhost:5173/api/customers \
                                        -H "$AUTH" -H "$JSON" \
                                        -d "{\"firstName\":\"Smoke\",\"lastName\":\"Test\",\"phone\":\"$PHONE\"}"
          check "duplicate phone"   409 -X POST http://localhost:5173/api/customers \
                                        -H "$AUTH" -H "$JSON" \
                                        -d "{\"firstName\":\"Smoke\",\"lastName\":\"Again\",\"phone\":\"$PHONE\"}"
          check "invalid customer"  400 -X POST http://localhost:5173/api/customers \
                                        -H "$AUTH" -H "$JSON" \
                                        -d "{\"firstName\":\"\",\"lastName\":\"Test\",\"phone\":\"$PHONE\"}"
          check "wildcard search"   200 -H "$AUTH" 'http://localhost:5173/api/customers?q=%25'
          check "unknown customer"  404 -H "$AUTH" \
                                        http://localhost:5173/api/customers/00000000-0000-0000-0000-000000000000

          # A policy needs a customer of its own, since the one above is reused
          # by the duplicate-phone check.
          CUSTOMER=$(curl -s -X POST http://localhost:5173/api/customers \
                       -H "$AUTH" -H "$JSON" \
                       -d "{\"firstName\":\"Policy\",\"lastName\":\"Holder\",\"phone\":\"${PHONE}9\"}" \
                     | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
          if [ -z "$CUSTOMER" ]; then
            echo "FAIL  could not create a customer for the policy"; exit 1
          fi

          POLICY_BODY="{\"customerId\":\"$CUSTOMER\",\"insuranceProvider\":\"Example Life\",\"policyType\":\"ENDOWMENT\",\"premiumAmount\":\"12000.00\",\"premiumFrequency\":\"YEARLY\",\"policyStartDate\":\"2024-01-01\",\"policyEndDate\":\"2027-01-01\"}"

          check "policy list"       200 -H "$AUTH" http://localhost:5173/api/policies
          check "policy create"     201 -X POST http://localhost:5173/api/policies \
                                        -H "$AUTH" -H "$JSON" -d "$POLICY_BODY"
          check "bad premium"       400 -X POST http://localhost:5173/api/policies \
                                        -H "$AUTH" -H "$JSON" \
                                        -d "{\"customerId\":\"$CUSTOMER\",\"insuranceProvider\":\"X\",\"policyType\":\"Y\",\"premiumAmount\":\"-1\",\"premiumFrequency\":\"YEARLY\"}"
          check "foreign customer"  404 -X POST http://localhost:5173/api/policies \
                                        -H "$AUTH" -H "$JSON" \
                                        -d "{\"customerId\":\"00000000-0000-0000-0000-000000000000\",\"insuranceProvider\":\"X\",\"policyType\":\"Y\",\"premiumAmount\":\"100.00\",\"premiumFrequency\":\"YEARLY\"}"

          POLICY=$(curl -s -X POST http://localhost:5173/api/policies \
                     -H "$AUTH" -H "$JSON" \
                     -d "{\"customerId\":\"$CUSTOMER\",\"insuranceProvider\":\"Example Life\",\"policyType\":\"TERM\",\"premiumAmount\":\"500.00\",\"premiumFrequency\":\"YEARLY\",\"policyStartDate\":\"2024-01-01\",\"policyEndDate\":\"2026-01-01\"}" \
                   | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
          check "premium schedule"  200 -H "$AUTH" "http://localhost:5173/api/policies/$POLICY/premiums"

          # The schedule must actually have been generated: 2024, 2025 and 2026.
          INSTALMENTS=$(curl -s -H "$AUTH" "http://localhost:5173/api/policies/$POLICY/premiums" \
                        | grep -o '"dueDate"' | wc -l | tr -d ' ')
          if [ "$INSTALMENTS" = "3" ]; then
            echo "ok    schedule generated (3 instalments)"
          else
            echo "FAIL  schedule generated: expected 3 instalments, got $INSTALMENTS"
            failed=1
          fi

          # Reminders and notifications.
          check "reminder config"   200 -H "$AUTH" http://localhost:5173/api/reminders/configuration
          check "reminder list"     200 -H "$AUTH" http://localhost:5173/api/reminders
          check "notifications"     200 -H "$AUTH" http://localhost:5173/api/notifications
          check "unread count"      200 -H "$AUTH" http://localhost:5173/api/notifications/unread-count
          check "agent may not run detection" 403 -X POST -H "$AUTH" http://localhost:5173/api/reminders/detect

          ADMIN=$(curl -s -X POST http://localhost:5173/api/auth/login \
                    -H "$JSON" \
                    -d '{"email":"admin@demo.local","password":"Password123!"}' \
                  | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          ADMIN_AUTH="Authorization: Bearer $ADMIN"
          check "manager may run detection" 200 -X POST -H "$ADMIN_AUTH" http://localhost:5173/api/reminders/detect

          # Detection runs on a timer, so running it again must raise nothing new.
          FIRST=$(curl -s -X POST -H "$ADMIN_AUTH" http://localhost:5173/api/reminders/detect)
          SECOND=$(curl -s -X POST -H "$ADMIN_AUTH" http://localhost:5173/api/reminders/detect)
          if echo "$FIRST" | grep -q '"created":0' && echo "$SECOND" | grep -q '"created":0'; then
            echo "ok    detection is repeatable (raised nothing new)"
          else
            echo "FAIL  detection raised new reminders on a repeat run: $FIRST then $SECOND"
            failed=1
          fi

          # Dashboard.
          check "dashboard"         200 -H "$AUTH" http://localhost:5173/api/dashboard

          # Rupees only, so a total across policies is meaningful.
          check "other currencies rejected" 400 -X POST http://localhost:5173/api/policies \
                                        -H "$AUTH" -H "$JSON" \
                                        -d "{\"customerId\":\"$CUSTOMER\",\"insuranceProvider\":\"X\",\"policyType\":\"TERM\",\"currencyCode\":\"USD\",\"premiumAmount\":\"100.00\",\"premiumFrequency\":\"YEARLY\"}"

          DASH=$(curl -s -H "$ADMIN_AUTH" http://localhost:5173/api/dashboard)
          if echo "$DASH" | grep -q '"overdue":{"count":[0-9]*,"amount":'; then
            echo "ok    dashboard reports a single money total"
          else
            echo "FAIL  unexpected dashboard money shape: $DASH"
            failed=1
          fi

          # An agent's dashboard is their own book, not the organization's.
          SCOPE=$(curl -s -H "$AUTH" http://localhost:5173/api/dashboard \
                  | sed -n 's/.*"scope":"\([^"]*\)".*/\1/p')
          if [ "$SCOPE" = "OWN_BOOK" ]; then
            echo "ok    agent dashboard is scoped to their own book"
          else
            echo "FAIL  agent dashboard scope was '$SCOPE', expected OWN_BOOK"
            failed=1
          fi

          exit $failed

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
