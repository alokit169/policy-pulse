spring:
  application:
    name: policy-pulse
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/policypulse}
    username: ${DATABASE_USERNAME:policypulse}
    password: ${DATABASE_PASSWORD:policypulse}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  # Behind nginx, honour X-Forwarded-* so request.getRemoteAddr() is the real
  # client rather than the proxy. The rate limiter keys on it.
  # The backend must not be reachable directly in production, or these headers
  # can be spoofed.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  seed: ${APP_SEED:false}
  jwt:
    secret: ${JWT_SECRET:local-dev-only-change-me-use-32-chars-min!!}
    # 8 hours. There is no refresh token, so this is the whole session length.
    # Raising it widens the window in which a stolen token is usable; the token
    # version is what revokes one before it expires.
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:80}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_RPM:120}
  ai:
    provider: ${AI_PROVIDER:mock}
    api-key: ${AI_API_KEY:}
  voice:
    provider: ${VOICE_PROVIDER:mock}
    api-key: ${VOICE_API_KEY:}
  notification:
    provider: ${NOTIFICATION_PROVIDER:mock}

logging:
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
