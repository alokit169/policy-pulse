spring:
  application:
    name: policy-pulse
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/policypulse}
    username: ${DATABASE_USERNAME:policypulse}
    password: ${DATABASE_PASSWORD:policypulse}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  seed: ${APP_SEED:false}
  jwt:
    secret: ${JWT_SECRET:local-dev-only-change-me-use-32-chars-min!!}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:80}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_RPM:120}
  ai:
    provider: ${AI_PROVIDER:mock}
    api-key: ${AI_API_KEY:}
  voice:
    provider: ${VOICE_PROVIDER:mock}
    api-key: ${VOICE_API_KEY:}
  notification:
    provider: ${NOTIFICATION_PROVIDER:mock}

logging:
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
