services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: policypulse
      POSTGRES_USER: policypulse
      POSTGRES_PASSWORD: policypulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policypulse -d policypulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/policypulse
      SPRING_DATASOURCE_USERNAME: policypulse
      SPRING_DATASOURCE_PASSWORD: policypulse
      JWT_SECRET: local-dev-only-change-me-use-32-chars-min!!
      # A local stack: the shipped signing key and demo accounts are fine here,
      # and StartupChecks refuses to start without this being said out loud.
      APP_DEV_MODE: "true"
      APP_SEED: "true"
      AI_PROVIDER: mock
      VOICE_PROVIDER: mock
      NOTIFICATION_PROVIDER: mock
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
